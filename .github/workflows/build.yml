name: Build ChatXY-Move

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q ChatXY-Move-1.21.11-Fabric-Source.zip -d project
          ls -la project/ChatXY-Move

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build mod
        working-directory: project/ChatXY-Move
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChatXY-Move-JAR
          path: project/ChatXY-Move/build/libs/*.jar
